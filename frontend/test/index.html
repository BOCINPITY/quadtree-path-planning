<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四叉树动态分割演示</title>
  <script src="https://unpkg.com/konva@8.4.2/konva.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #container {
      width: 800px;
      height: 600px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }
    .controls {
      margin-top: 10px;
    }
    button {
      padding: 8px 16px;
      margin-right: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>四叉树动态分割演示</h1>
  <div id="container"></div>
  <div class="controls">
    <button id="start-btn">开始动画</button>
    <button id="pause-btn">暂停动画</button>
    <button id="reset-btn">重置动画</button>
  </div>
  <script src="./app.js"></script>
</body>
</html>
